name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: zsh-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zsh-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh + hyperfine
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh hyperfine

      - name: Syntax check every module (zsh -n)
        run: |
          set -e
          fail=0
          for f in lib/*.zsh tools/*.zsh tools/*/*.zsh scripts/*.zsh tests/*.zsh tests/cases/*.zsh aliases.zsh functions.zsh zsh_backuprc.zsh; do
            if zsh -n "$f"; then
              echo "OK    $f"
            else
              echo "FAIL  $f"
              fail=1
            fi
          done
          for f in scripts/*.sh; do
            if sh -n "$f"; then
              echo "OK    $f (sh -n)"
            else
              echo "FAIL  $f (sh -n)"
              fail=1
            fi
          done
          exit $fail

      - name: Guard against re-duplicated bootstrap
        run: |
          copies=$(grep -c 'source "\$ZSH_HOME/lib/errors.zsh"' zsh_backuprc.zsh || true)
          echo "bootstrap copies in snapshot: $copies"
          if [ "$copies" -gt 1 ]; then
            echo "ERROR: zsh_backuprc.zsh contains duplicated framework bootstrap"
            exit 1
          fi

      - name: Every module has a source-once guard
        run: |
          fail=0
          for f in tools/*.zsh tools/*/*.zsh lib/*.zsh aliases.zsh functions.zsh; do
            if ! grep -q 'typeset -g _ZSH' "$f"; then
              echo "MISSING guard: $f"
              fail=1
            fi
          done
          exit $fail

      - name: Smoke-source modules in a clean shell
        run: |
          export ZSH_HOME="$PWD"
          zsh -c '
            source lib/errors.zsh || exit 1
            source lib/utils.zsh || exit 1
            for t in tools/*.zsh tools/*/*.zsh; do
              source "$t" || { echo "FAILED to source: $t" >&2; exit 1; }
            done
            source aliases.zsh || exit 1
            source functions.zsh || exit 1
            # sourcing twice must be a no-op (idempotency)
            source tools/git.zsh || exit 1
            echo "smoke-source OK"
          '

      - name: No dangerous startup patterns in zsh_backuprc.zsh
        run: |
          if grep -v '^\s*#' zsh_backuprc.zsh | grep -InE 'unalias[[:space:]]+-m|source.*nvm\.sh|conda shell\.zsh hook|curl.*\|.*(sh|bash|zsh)|wget.*\|.*(sh|bash|zsh)'; then
            echo "ERROR: startup orchestrator contains a dangerous pattern (see above)"
            exit 1
          fi
          echo "OK: no dangerous startup patterns"

      - name: No machine-specific absolute paths
        run: |
          if grep -RInE '/home/[A-Za-z0-9._-]+/|/Users/[A-Za-z0-9._-]+/' . \
              --exclude-dir=.git --exclude-dir=.audit; then
            echo "ERROR: machine-specific absolute path found (see above)"
            exit 1
          fi
          echo "OK: no machine-specific absolute paths"

      - name: Regression tests (hermetic)
        run: |
          zsh tests/run.zsh

      - name: Framework audit
        run: |
          export ZSH_HOME="$PWD"
          # zsh_audit checks the DEPLOYED ~/.zshrc (not the repo file
          # directly) for several startup-safety checks; mirror it here
          # so the audit has something meaningful to check in a fresh
          # checkout, same as scripts/bootstrap.zsh would on a real machine.
          cp zsh_backuprc.zsh "$HOME/.zshrc"
          zsh -f -c '
            source lib/errors.zsh
            source lib/utils.zsh
            source tools/audit.zsh
            zsh_audit
          '
